/* ankle nudge scoped to the current episode (see 9/27 fix) */
function ankleOverdueDays(){
  var hist = ankleNoteHistory();
  if(!hist.length) return null;
  var latest = hist[hist.length-1];
  if(daysBetweenKeys(latest.k, todayKey()) > 14) return null;
  var episodeStart = latest.k;
  for(var i=hist.length-2; i>=0; i--){
    if(daysBetweenKeys(hist[i].k, episodeStart) <= 14){ episodeStart = hist[i].k; } else { break; }
  }
  return daysBetweenKeys(episodeStart, todayKey());
}
function ankleRecentlyMentioned(){
  var hist = ankleNoteHistory();
  return !!(hist.length && daysBetweenKeys(hist[hist.length-1].k, todayKey()) <= 14);
}

/* ================= persistence =================
   Fix (9/28): the old debounce kept only the LAST (scope,key). Editing day A
   then day B within 450 ms saved both locally but queued only B for Supabase,
   so A silently never reached the other device. Dirty keys now accumulate in
   sets and every one of them is pushed.
   Fix (9/28): saving no longer calls render(). Re-rendering 450 ms after each
   keystroke replaced the <textarea>/<input> the person was typing in, which
   dropped focus and the caret mid-sentence. */
const DIRTY = { day: new Set(), test: new Set(), settings: false, all: false };
function scheduleSave(scope, key){
  var now = new Date().toISOString();
  if(scope==='day' && key){ if(state.dayLogs[key]) state.dayLogs[key]._updatedAt = now; DIRTY.day.add(key); }
  else if(scope==='test' && key){ if(state.testLogs[key]) state.testLogs[key]._updatedAt = now; DIRTY.test.add(key); }
  else if(scope==='settings'){ state._settingsUpdatedAt = now; DIRTY.settings = true; }
  else { DIRTY.all = true; }
  if(state.saveTimer) clearTimeout(state.saveTimer);
  state.saveTimer = setTimeout(flushSaves, CONFIG.SAVE_DEBOUNCE_MS);
}
function flushSaves(){
  if(state.saveTimer){ clearTimeout(state.saveTimer); state.saveTimer = null; }
  var days = Array.from(DIRTY.day), tests = Array.from(DIRTY.test);
  var settings = DIRTY.settings, all = DIRTY.all;
  DIRTY.day.clear(); DIRTY.test.clear(); DIRTY.settings = false; DIRTY.all = false;
  if(!days.length && !tests.length && !settings && !all) return;
  // all three writes start synchronously (no await between them), so this is
  // safe to call from pagehide/visibilitychange on mobile
  Promise.all([
    STORE.set('training-log', JSON.stringify(state.dayLogs)),
    STORE.set('test-log', JSON.stringify(state.testLogs)),
    STORE.set('settings', JSON.stringify({ankleMode: state.ankleMode, migratedV2: state.migratedV2}))
  ]).catch(function(){});
  try{
    if(all){ SYNC.queuePushAll(); return; }
    days.forEach(function(k){ SYNC.queuePush('atr_day_logs', k, state.dayLogs[k]); });
    tests.forEach(function(k){ SYNC.queuePush('atr_test_logs', k, state.testLogs[k]); });
    if(settings) SYNC.queuePush('atr_settings', 'main', {ankleMode: state.ankleMode, migratedV2: state.migratedV2, _updatedAt: state._settingsUpdatedAt});
  }catch(e){}
}
if(typeof window !== 'undefined'){
  // closing the tab / backgrounding the app within the debounce window used to lose the last edit
  window.addEventListener('pagehide', flushSaves);
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'hidden') flushSaves(); });
}

/* fills in the 2026-09-14 backup for dates missing locally or older locally
   than the seed. Never overwrites a newer local/Supabase edit, never pushes. */
function mergeSeed(){
  [['dayLogs', DATA_SEED.dayLogs || {}], ['testLogs', DATA_SEED.testLogs || {}]].forEach(function(pair){
    var target = state[pair[0]], src = pair[1];
    Object.keys(src).forEach(function(k){
      var seedEntry = src[k], local = target[k];
      if(!local){ target[k] = JSON.parse(JSON.stringify(seedEntry)); return; }
      var seedTs = seedEntry._updatedAt ? new Date(seedEntry._updatedAt).getTime() : 0;
      var localTs = local._updatedAt ? new Date(local._updatedAt).getTime() : 0;
      if(seedTs > localTs) target[k] = JSON.parse(JSON.stringify(seedEntry));
    });
  });
}

/* the three plan changes from the 9/27 review, each only applied to an
   untouched entry (not done, no note) so a real edit is never clobbered */
function runMigrationsV2(){

  if(d928 && d928.dayType==='推日' && !d928.dayDone && !d928.note){

/* Fix (9/28): migrations used to run whenever the Supabase client wasn't
   connected — including when a Supabase config EXISTS but the SDK failed to
   load (offline). In that case local data may be stale, and the migration's
   fresh timestamps could later overwrite newer edits from another device.
   Now: run only with no Supabase configured at all, or after a successful pull. */
function canRunMigrations(){
  var configured = !!(state.supaUrl && state.supaKey);
  return !configured || SYNC.lastPullOk;
}

async function loadAll(){
  try{ const dl = await STORE.get('training-log'); if(dl) state.dayLogs = JSON.parse(dl); }catch(e){}
  try{ const tl = await STORE.get('test-log'); if(tl) state.testLogs = JSON.parse(tl); }catch(e){}
  try{
    const st = await STORE.get('settings');
    if(st){ const o = JSON.parse(st); state.ankleMode = !!o.ankleMode; state.migratedV2 = !!o.migratedV2; }
  }catch(e){}
  try{
    const cfg = await STORE.get('supa-config');
    if(cfg){ const o = JSON.parse(cfg); state.supaUrl = o.url||''; state.supaKey = o.key||''; }
  }catch(e){}
  state.loaded = true;
  if(state.supaUrl && state.supaKey){
    SYNC.init(state.supaUrl, state.supaKey);
    await SYNC.pullAndMerge();
  }
  mergeSeed();
  if(!state.migratedV2 && canRunMigrations()) runMigrationsV2();
}


/* ================= SYNC (Supabase cross-device sync, offline-first) =================
   Design: every write happens to localStorage / window.storage immediately
   (see STORE + persistAll above), so the app is fully usable offline. On top
   of that, each changed date-entry (one day's log, or one test date) is
   queued and pushed to Supabase individually — never the whole table at
   once — so that a phone and a laptop editing different days at the same
   time merge cleanly instead of one overwriting the other. Conflicts are
   resolved per-entry by comparing the "_updatedAt" timestamp stored inside
   that entry's own JSON: newer wins. The pending queue itself lives in
   localStorage under 'atr_sync_queue' so it survives a refresh or the app
   being closed mid-sync while offline. */
const SYNC = {
  client: null,
  queue: [],       // [{table, date_key, data, updated_at}]
  flushing: false,
  lastPullOk: false,

  init(url, key){
    try{
      if(!url || !key || typeof window.supabase === 'undefined') { state.supaConnected=false; return false; }
      this.client = window.supabase.createClient(url, key);
      state.supaConnected = true;
      this.loadQueue();
      this.flushQueue();
      return true;
    }catch(e){ state.supaConnected = false; return false; }
  },

  loadQueue(){
    try{ var raw = localStorage.getItem('atr_sync_queue'); this.queue = raw ? JSON.parse(raw) : []; }
    catch(e){ this.queue = []; }
  },
  saveQueue(){
    try{ localStorage.setItem('atr_sync_queue', JSON.stringify(this.queue)); }catch(e){}
  },

  queuePush(table, dateKey, dataObj){
    if(!dataObj) return;
    if(!dataObj._updatedAt) dataObj._updatedAt = new Date().toISOString();
    // replace any existing queued write for the same row — only the latest
    // local version needs to reach the server, not every intermediate edit
    this.queue = this.queue.filter(function(q){ return !(q.table===table && q.date_key===dateKey); });
    this.queue.push({table:table, date_key:dateKey, data:dataObj, updated_at:dataObj._updatedAt});
    this.saveQueue();
    state.syncStatus = state.supaConnected ? 'pending' : 'off';
    this.flushQueue();
  },
  queuePushAll(){
    var self = this;
    Object.keys(state.dayLogs).forEach(function(k){ self.queuePush('atr_day_logs', k, state.dayLogs[k]); });
    Object.keys(state.testLogs).forEach(function(k){ self.queuePush('atr_test_logs', k, state.testLogs[k]); });
  },

  async flushQueue(){
    if(this.flushing) return;
    if(!state.supaConnected || !this.client) return;
    if(typeof navigator!=='undefined' && navigator.onLine===false) return;
    this.flushing = true;
    try{
      while(this.queue.length){
        var item = this.queue[0];
        try{
          var res = await this.client.from(item.table).upsert({
            date_key: item.date_key, data: item.data, updated_at: item.updated_at
          }, {onConflict:'date_key'});
          if(res.error) throw res.error;
          this.queue.shift();
          this.saveQueue();
          state.syncStatus = 'ok'; state.syncMsg = '已同步';
        }catch(e){
          state.syncStatus = 'err'; state.syncMsg = '同步失敗，會在下次連線時重試：'+(e && e.message ? e.message : '未知錯誤');
          break; // stop draining; keep remaining items queued for retry
        }
      }
      if(this.queue.length===0 && state.syncStatus!=='err'){ state.syncStatus='ok'; }
    } finally {
      this.flushing = false;
      renderIfIdle();
    }
  },

  /* pull every remote row and merge into local state. per-entry: remote
     wins only if its _updatedAt is strictly newer than local's, AND that
     local entry isn't itself still sitting unsent in the queue (an unsent
     local edit must never be silently discarded by an older remote read). */
  async pullAndMerge(){
    if(!state.supaConnected || !this.client){ return; } // no client = nothing verified; lastPullOk stays false
    var self = this;
    try{
      var dayRes = await this.client.from('atr_day_logs').select('date_key,data,updated_at');
      if(!dayRes.error && dayRes.data){
        dayRes.data.forEach(function(row){
          if(self.queuedFor('atr_day_logs', row.date_key)) return; // unsent local edit wins
          var local = state.dayLogs[row.date_key];
          var remoteTs = row.updated_at ? new Date(row.updated_at).getTime() : 0;
          var localTs = (local && local._updatedAt) ? new Date(local._updatedAt).getTime() : 0;
          if(!local || remoteTs > localTs){ state.dayLogs[row.date_key] = row.data; }
        });
      }
      var testRes = await this.client.from('atr_test_logs').select('date_key,data,updated_at');
      if(!testRes.error && testRes.data){
        testRes.data.forEach(function(row){
          if(self.queuedFor('atr_test_logs', row.date_key)) return;
          var local = state.testLogs[row.date_key];
          var remoteTs = row.updated_at ? new Date(row.updated_at).getTime() : 0;
          var localTs = (local && local._updatedAt) ? new Date(local._updatedAt).getTime() : 0;
          if(!local || remoteTs > localTs){ state.testLogs[row.date_key] = row.data; }
        });
      }
      var setRes = await this.client.from('atr_settings').select('data,updated_at').eq('date_key','main').maybeSingle();
      if(!setRes.error && setRes.data){
        var remoteTs2 = setRes.data.updated_at ? new Date(setRes.data.updated_at).getTime() : 0;
        var localTs2 = state._settingsUpdatedAt ? new Date(state._settingsUpdatedAt).getTime() : 0;
        if(remoteTs2 > localTs2 && setRes.data.data){
          state.ankleMode = !!setRes.data.data.ankleMode;
          if(setRes.data.data.migratedV2) state.migratedV2 = true;
        }
      }
      try{ await STORE.set('training-log', JSON.stringify(state.dayLogs)); }catch(e){}
      try{ await STORE.set('test-log', JSON.stringify(state.testLogs)); }catch(e){}
      state.syncMsg = '已從雲端同步最新資料';
      this.lastPullOk = !dayRes.error && !testRes.error;
      renderIfIdle();
    }catch(e){ this.lastPullOk = false; /* pull failure is silent — local data still fully usable */ }
  },
  queuedFor(table, dateKey){
    return this.queue.some(function(q){ return q.table===table && q.date_key===dateKey; });
  }
};

if(typeof window !== 'undefined'){
  window.addEventListener('online', function(){ SYNC.flushQueue(); });
}


/* ---- manual backup / restore (JSON) ----
   window.storage keeps data safe while this file is opened inside Claude;
   localStorage keeps it safe on one browser/device if hosted elsewhere
   (e.g. GitHub Pages). Neither syncs between devices. This export/import
   is the portable, host-agnostic path: copy the text out, paste it back in
   anywhere — Claude, GitHub Pages, a new phone, etc. */
function buildBackupJSON(){
  return JSON.stringify({
    exportedAt: new Date().toISOString(),
    version: 3,
    dayLogs: state.dayLogs,
    testLogs: state.testLogs,
    settings: {ankleMode: state.ankleMode, migratedV2: state.migratedV2}
  }, null, 0);
}
function downloadBackupFile(){
  try{
    var blob = new Blob([buildBackupJSON()], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'asymmetry-training-backup-'+todayKey()+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    return true;
  }catch(e){ return false; }
}
async function copyBackupToClipboard(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    try{
      var ta = document.getElementById('backup-ta');
      if(ta){ ta.focus(); ta.select(); document.execCommand('copy'); return true; }
    }catch(e2){}
    return false;
  }
}
function restoreFromBackupText(text){
  try{
    var o = JSON.parse(text);
    if(!o || typeof o !== 'object') throw new Error('bad shape');
    if(o.dayLogs) state.dayLogs = Object.assign({}, state.dayLogs, o.dayLogs);
    if(o.testLogs) state.testLogs = Object.assign({}, state.testLogs, o.testLogs);
    if(o.settings && typeof o.settings.ankleMode==='boolean') state.ankleMode = o.settings.ankleMode;
    if(o.settings && typeof o.settings.migratedV2==='boolean') state.migratedV2 = o.settings.migratedV2;
    scheduleSave(); // bulk restore, no single date-key — pushes every entry
    return true;
  }catch(e){ return false; }
}

/* ================= phase gates ================= */
function phase2Unlocked(){
  var keys = Object.keys(state.testLogs).length ? Object.keys(state.testLogs) : TEST_DATE_KEYS;
  // sort by the date KEY, not the 測試日期 field (a new entry may not have that field)
  var filled = keys.slice().sort().map(function(k){ return peekTestLog(k); }).filter(function(t){ return t['靠牆滑行 左肋外翻']; });
  if(!filled.length) return false;
  var latest = filled[filled.length-1];
  return latest['靠牆滑行 左肋外翻'] === '否';
}
function phase3Ready(){
  var keys = TEST_DATE_KEYS;
  var filled = keys.slice().sort().map(function(k){ return peekTestLog(k); }).filter(function(t){ return t['左手划船8RM kg'] && t['右手划船8RM kg']; });
  if(filled.length < 2) return false;
  var last2 = filled.slice(-2);
  return last2.every(function(t){
    var l = parseFloat(t['左手划船8RM kg']), r = parseFloat(t['右手划船8RM kg']);
    var diff = r ? Math.abs(r-l)/r*100 : 100;
    var noNumb = t['EAST 有無麻'] === '無' || t['EAST 有無麻'] === '否';
    return diff < 10 && noNumb;
  });
}

/* advisory pre-check for 推日／拉日: numbness (daily checkbox or any exercise
   marked 麻／電／刺痛) or a high F score in the previous 3 days. */
function upperRedFlagMiniHtml(k, dayType){
  if(dayType!=='推日' && dayType!=='拉日') return '';
  var idx = SCHEDULE_KEYS.indexOf(k);
  if(idx===-1) return '';

}

}

/* ================= DOMAIN LAYER (9/28) =================
   Everything here is a pure-ish function of `state` + static data: no DOM,
   no writes. Routing, progression and gates are *derived* from the history
   of logs on every render instead of being stored as mutable flags. That
   removes a whole class of bugs (a stored "substituted" flag that falls out
   of sync between two devices, or survives after the user edits history):
   edit a past log and every downstream decision recomputes itself. */

const UPPER_DIRS = new Set(['push', 'pull', 'arm', 'carry']);
const SX_STATES = [
  { v: 'ok',     label: '正常' },
  { v: 'ache',   label: '酸' },
  { v: 'scrape', label: '刮／卡' },
  { v: 'neuro',  label: '麻／電／刺痛' }
];
const WING_LEVELS = ['靜止就翹', '60° 以下', '60-90°', '90° 以上才翹', '無翹起']; // ordinal: higher = better

/* per-render memo: several cards ask for the same gate / route / history
   scan; render() clears it so results never go stale across edits. */
let MEMO = new Map();
function memo(key, fn) {
  if (MEMO.has(key)) return MEMO.get(key);
  const v = fn();
  MEMO.set(key, v);
  return v;
}
function clearMemo() { MEMO = new Map(); }

const exKeyOf = ex => ex.id || exKey(ex['課表日'], ex['順序']);
const isTracked = ex => !!ex.id && ex.dir !== 'reset' && ex.dir !== 'test' && ex['類別'] !== '重設' && ex['類別'] !== '測試';
const fmtKg = n => (Math.round(n * 100) / 100).toString();
const roundToStep = (n, step) => step > 0 ? Math.round(n / step) * step : Math.round(n * 2) / 2;

function parseRepTop(s) {
  const m = String(s || '').match(/×\s*(\d+)(?:\s*-\s*(\d+))?/);
  return m ? parseInt(m[2] || m[1], 10) : null;
}
function sidesOf(presc) {
  if (presc.R === '雙側') return ['B'];
  const out = [];
  if (presc.L && presc.L !== '—' && presc.L !== '依原動作') out.push('L');
  if (presc.R && presc.R !== '—' && presc.R !== '依原動作') out.push('R');
  return out;
}
function sideRecHasData(r) {
  if (!r) return false;
  return ['L', 'R', 'B'].some(s => r[s] && ((r[s].kg !== undefined && r[s].kg !== '') || (r[s].n !== undefined && r[s].n !== '')));
}
/* a day "had a session" if it was marked done OR anything was ticked/logged —
   people often tick exercises without pressing 標記今天完成, and the 24-hour
   rule and the gate must not silently ignore those days */
function dayHadSession(w) {
  if (!w) return false;
  if (w.dayDone) return true;
  if (w.exDone && Object.keys(w.exDone).some(k => w.exDone[k])) return true;
  return !!(w.sx && Object.keys(w.sx).some(id => w.sx[id] && (w.sx[id].st || sideRecHasData(w.sx[id]))));
}
function dayHasNeuro(d) {
  const w = state.dayLogs[d];
  return !!(w && w.sx && Object.keys(w.sx).some(id => w.sx[id] && w.sx[id].st === 'neuro'));
}

/* ---------- block / phase ---------- */
function effectiveBlock(k) {
  const b = blockForKey(k);
  if (!b) return null;
  if (b.name === '回歸期') return returnGateStatus(k).passed ? '回歸期' : '肩胛重建期';
  return b.name;
}
function prescriptionFor(ex, k) {
  const base = { L: ex['左邊'], R: ex['右邊'], optional: false, rebuild: false, skip: false };
  if (!ex.rebuild || effectiveBlock(k) !== '肩胛重建期') return base;
  if (ex.rebuild.skip) return Object.assign({}, base, { skip: true, rebuild: true });
  return {
    L: ex.rebuild.L !== undefined ? ex.rebuild.L : ex['左邊'],
    R: ex.rebuild.R !== undefined ? ex.rebuild.R : ex['右邊'],
    optional: !!ex.rebuild.optional, rebuild: true, skip: false
  };
}

/* ---------- routing state machine (derived) ----------
   normal --(麻/電/刺痛 on the original)--> sub
   sub    --(麻/電/刺痛 on the substitute)--> sub, repeat=true, clean=0
   sub    --(clean session)--> clean+1; clean >= N --> normal
   A "session" = the slot was ticked done, or anything was logged for it. */
function routeState(id, k) {
  return memo('route|' + id + '|' + k, () => {
    let mode = 'normal', clean = 0, since = null, repeat = false;
    for (const d of SCHEDULE_KEYS) {
      if (d >= k) break;
      const w = state.dayLogs[d];
      if (!w) continue;
      const rec = w.sx && w.sx[id];
      const did = (w.exDone && w.exDone[id]) || (rec && (rec.st || sideRecHasData(rec)));
      if (!did) continue;
      const st = (rec && rec.st) || 'ok';
      if (st === 'neuro') { repeat = (mode === 'sub'); mode = 'sub'; clean = 0; since = d; }
      else if (mode === 'sub') {
        clean++;
        if (clean >= CONFIG.NEURO_RECOVERY_SESSIONS) { mode = 'normal'; clean = 0; repeat = false; }
      }
    }
    return { mode, clean, since, repeat };
  });
}
function lastSessionState(id, k) {
  for (let i = SCHEDULE_KEYS.length - 1; i >= 0; i--) {
    const d = SCHEDULE_KEYS[i];
    if (d >= k) continue;
    const w = state.dayLogs[d];
    const rec = w && w.sx && w.sx[id];
    if (rec && rec.st) return { d, st: rec.st };
    if (w && w.exDone && w.exDone[id]) return { d, st: 'ok' };
  }
  return null;
}
/* hard stop for the rest of the day: any 麻/電/刺痛 on an upper-body loaded
   movement locks every other upper loaded movement (resets stay available). */
function upperStopInfo(work) {
  const ids = [];
  if (work && work.sx) {
    Object.keys(work.sx).forEach(id => {
      const r = work.sx[id];
      const ex = EX_BY_ID[id];
      if (r && r.st === 'neuro' && ex && UPPER_DIRS.has(ex.dir)) ids.push(id);
    });
  }
  return { stopped: ids.length > 0, ids };
}

/* ---------- progression ---------- */
function lastSideLog(id, side, k, sub) {
  sub = sub || '';
  for (let i = SCHEDULE_KEYS.length - 1; i >= 0; i--) {
    const d = SCHEDULE_KEYS[i];
    if (d >= k) continue;
    const w = state.dayLogs[d];
    const r = w && w.sx && w.sx[id];
    if (!r || (r.sub || '') !== sub) continue;
    const s = r[side];
    if (!s) continue;
    const kg = numOrNull(s.kg), n = numOrNull(s.n);
    if (kg === null && n === null) continue;
    return { d, kg, n, st: r.st || 'ok' };
  }
  return null;
}
function baselineF(d) {
  const vals = [];
  for (let i = 1; i <= 7; i++) {
    const w = state.dayLogs[dateKey(addDays(keyToDate(d), -i))];
    const v = w ? numOrNull(w.symF) : null;
    if (v !== null) vals.push(v);
  }
  if (!vals.length) return null;
  vals.sort((a, b) => a - b);
  return vals[Math.floor(vals.length / 2)];
}
/* 24-hour rule: next-morning F after a session, vs the person's own baseline */
function fResponseAfter(d) {
  const w = state.dayLogs[dateKey(addDays(keyToDate(d), 1))];
  const f = w ? numOrNull(w.symF) : null;
  if (f === null) return { st: 'na' };
  const base = baselineF(d);
  const high = f >= CONFIG.F_HIGH_ABS || (base !== null && f >= base + CONFIG.F_HIGH_DELTA);
  return { st: high ? 'high' : 'ok', f, base };
}
/* next-session suggestion for one side. Rules, in priority order:
   1 neural symptom last time → routed elsewhere   2 刮/卡 → hold, stop ROM early
   3 next-morning F high → −10–20%                 4 重建期 → hold upper loads
   5 stronger side waits for weaker (<90%)         6 hit top of rep range → +inc
   7 otherwise hold and chase the rep target                                   */
function suggestNext(ex, side, k, sub, presc, incOverride) {
  const inc = incOverride !== undefined ? incOverride : (ex.inc || 0);
  const unit = ex.unit || '下';
  const last = lastSideLog(ex.id, side, k, sub);
  if (!last) {
    return { cls: 'na', last: '', txt: sub ? '替代動作：輕重量、以不誘發症狀為準' : '首次記錄：依起始設定，RPE ≤ 7' };
  }
  const kgTxt = last.kg !== null ? ' ' + fmtKg(last.kg) + 'kg' : '';
  const lastTxt = '上次 ' + fmtMD(keyToDate(last.d)) + '：' +
    (last.kg !== null ? fmtKg(last.kg) + 'kg' : '') + (last.n !== null ? (last.kg !== null ? ' × ' : '') + last.n + unit : '');
  const R = (cls, txt) => ({ cls, txt, last: lastTxt });
  if (last.st === 'neuro') return R('bad', '上次出現神經症狀 → 本次已自動降階');
  if (last.st === 'scrape') return R('warn', '維持' + kgTxt + '；離心停在刮之前 2–3 cm');
  const fr = fResponseAfter(last.d);
  if (fr.st === 'high') {
    return last.kg !== null
      ? R('warn', '上次隔天 F=' + fr.f + '（偏高）→ 減 10–20%：約 ' + fmtKg(roundToStep(last.kg * 0.85, inc || 0.5)) + 'kg')
      : R('warn', '上次隔天 F=' + fr.f + '（偏高）→ 次數減 20%');
  }
  if (effectiveBlock(k) === '肩胛重建期' && UPPER_DIRS.has(ex.dir)) return R('hold', '重建期：維持' + kgTxt + '，專注幅度與節奏');
  const other = side === 'L' ? 'R' : (side === 'R' ? 'L' : null);
  if (other && last.kg !== null && last.kg > 0) {
    const o = lastSideLog(ex.id, other, k, sub);
    if (o && o.kg !== null && o.kg > 0 && last.kg > o.kg) {
      const ratio = o.kg / last.kg;
      if (ratio < CONFIG.WEAK_SIDE_RATIO) return R('hold', '先等' + (other === 'L' ? '左' : '右') + '邊追上（目前 ' + Math.round(ratio * 100) + '%）：維持' + kgTxt);
    }
  }
  const top = parseRepTop(side === 'B' ? presc.L : presc[side]);
  if (top && last.n !== null && last.n >= top) {
    if (inc > 0 && last.kg !== null) return R('ok', '上次做滿 ' + last.n + unit + ' → 加 ' + fmtKg(inc) + 'kg（' + fmtKg(last.kg + inc) + 'kg）');
    return R('ok', '上次做滿 ' + last.n + unit + ' → 可以加難度（見進階條件）');
  }
  if (top) return R('hold', '維持' + kgTxt + '，目標做到 ' + top + unit);
  return R('hold', '維持上次設定');
}

/* ---------- 回歸期 gate (W11-12) ---------- */
function returnGateStatus(k) {
  return memo('gate|' + k, () => {
    const start = BLOCKS[0].startKey;
    const upperDays = SCHEDULE_KEYS.filter(d => {
      if (d < start || d >= k) return false;
      const w = state.dayLogs[d];
      return w && dayHadSession(w) && (w.dayType === '推日' || w.dayType === '拉日');
    });
    const last2 = upperDays.slice(-2);
    const c1 = last2.length < 2
      ? { st: 'na', txt: '最近 2 次推／拉日 0 麻', note: '完成的推／拉日 ' + last2.length + '/2 次' }
      : (last2.every(d => !state.dayLogs[d].numb && !dayHasNeuro(d))
          ? { st: 'ok', txt: '最近 2 次推／拉日 0 麻', note: last2.map(d => fmtMD(keyToDate(d))).join('、') }
          : { st: 'bad', txt: '最近 2 次推／拉日 0 麻', note: '有記錄到麻' });

    const fvals = [];
    for (let i = 1; i <= 7; i++) {
      const w = state.dayLogs[dateKey(addDays(keyToDate(k), -i))];
      const v = w ? numOrNull(w.symF) : null;
      if (v !== null) fvals.push(v);
    }
    const fmax = fvals.length ? Math.max.apply(null, fvals) : null;
    const c2 = fmax === null
      ? { st: 'na', txt: '前 7 天 F 最高 ≤ ' + CONFIG.GATE_F_MAX, note: '前 7 天沒有記 F' }
      : { st: fmax <= CONFIG.GATE_F_MAX ? 'ok' : 'bad', txt: '前 7 天 F 最高 ≤ ' + CONFIG.GATE_F_MAX, note: '最高 ' + fmax };

    const tests = allTestKeys().filter(d => d <= k).sort();
    let tall = null;
    for (let i = tests.length - 1; i >= 0; i--) {
      const v = numOrNull(peekTestLog(tests[i])['挺直呼氣60秒 F出現秒數']);
      if (v !== null) { tall = { d: tests[i], v }; break; }
    }
    const c3 = !tall
      ? { st: 'na', txt: '挺直呼氣 ≥ ' + CONFIG.GATE_TALL_EXHALE_SEC + ' 秒才酸', note: '測試頁還沒記錄' }
      : { st: tall.v >= CONFIG.GATE_TALL_EXHALE_SEC ? 'ok' : 'bad', txt: '挺直呼氣 ≥ ' + CONFIG.GATE_TALL_EXHALE_SEC + ' 秒才酸', note: fmtMD(keyToDate(tall.d)) + '：' + tall.v + ' 秒' };

    const wings = tests.map(d => ({ d, lv: WING_LEVELS.indexOf(peekTestLog(d)['動態翼狀 出現角度']) })).filter(x => x.lv >= 0);
    let c4;
    const w4 = { txt: '動態翼狀比上次改善' };
    if (!wings.length) c4 = Object.assign(w4, { st: 'na', note: '測試頁還沒記錄' });
    else {
      const cur = wings[wings.length - 1];
      if (cur.lv === 0) c4 = Object.assign(w4, { st: 'bad', note: '靜止就翹＝紅旗' });
      else if (cur.lv === WING_LEVELS.length - 1) c4 = Object.assign(w4, { st: 'ok', note: fmtMD(keyToDate(cur.d)) + '：無翹起' });
      else if (wings.length < 2) c4 = Object.assign(w4, { st: 'na', note: '需要第二次錄影對照（測試頁新增一次額外測試）' });
      else {
        const prev = wings[wings.length - 2];
        c4 = Object.assign(w4, cur.lv > prev.lv
          ? { st: 'ok', note: WING_LEVELS[prev.lv] + ' → ' + WING_LEVELS[cur.lv] }
          : { st: 'bad', note: WING_LEVELS[prev.lv] + ' → ' + WING_LEVELS[cur.lv] + '（沒有進步）' });
      }
    }
    const c = [c1, c2, c3, c4];
    return { c, passed: c.every(x => x.st === 'ok') };
  });
}

/* ---------- view-model: one place decides what a card is and whether it's usable ----------
   Render, progress counting and "一鍵完成" all read the same view-model, so
   they can't disagree (previously 一鍵完成 could tick a locked exercise). */
function exViewModel(ex, k, work) {
  const key = exKeyOf(ex);
  const tracked = isTracked(ex);
  const presc = tracked ? prescriptionFor(ex, k) : { L: ex['左邊'], R: ex['右邊'], optional: false, rebuild: false, skip: false };
  const route = (tracked && ex.fallback) ? routeState(ex.id, k) : { mode: 'normal', clean: 0, since: null, repeat: false };
  const fb = route.mode === 'sub' ? (EX_BY_ID[ex.fallback] || null) : null;
  let lock = null, lockTxt = '';
  if (ex['階段'] && ex['階段'] !== '全期' && !phase2Unlocked()) {
    lock = 'phase'; lockTxt = '🔒 Phase 2 才解封 — 靠牆滑行「左肋外翻」由「是」轉「否」才解封';
  } else if (ex['解鎖日'] && k < ex['解鎖日']) {
    lock = 'date'; lockTxt = '🔒 ' + fmtMD(keyToDate(ex['解鎖日'])) + ' 起、而且回歸期四項門檻全數通過才解封';
  } else if (ex['解鎖日'] && !returnGateStatus(k).passed) {
    const miss = returnGateStatus(k).c.filter(x => x.st !== 'ok').map(x => x.txt);
    lock = 'gate'; lockTxt = '🔒 回歸期門檻未通過（' + miss.join('、') + '）';
  } else if (presc.skip) {
    lock = 'rebuild'; lockTxt = '⏸ 肩胛重建期暫停這一項（會重現下角酸的背闊肌／大圓肌動作）';
  } else if (tracked && UPPER_DIRS.has(ex.dir)) {
    const si = upperStopInfo(work);
    if (si.stopped && si.ids.indexOf(ex.id) === -1 && !work.exDone[key]) {
      const names = si.ids.map(id => EX_BY_ID[id] ? EX_BY_ID[id]['動作名稱'] : id).join('、');
      lock = 'neuro'; lockTxt = '⛔ 今天在「' + names + '」出現神經症狀 → 停止上肢負重，只做重設';
    }
  }
  return { ex, key, tracked, presc, route, fb, lock, lockTxt, optional: !!presc.optional, done: !!(work.exDone && work.exDone[key]) };
}

/* planned-phase context row (collapsible). Red is reserved for red flags. */
function blockBannerHtml(k){
  var b = blockForKey(k);
  if(!b) return '';

  if(b.name==='回歸期'){

/* prescription → compact instrument text: "3 組 × 10" → "3 × 10" */
function rxText(s){ return String(s||'').replace(/\s*組\s*×\s*/g,' × ').trim(); }
function rxHtml(L, R){
  if(R === '雙側') return (L && L!=='—') ? '<span class="rx rx-b">'+escHtml(rxText(L))+'</span>' : '';
  var h = '';
  if(L && L!=='—' && L!=='依原動作') h += '<span class="rx rx-l"><b>L</b> '+escHtml(rxText(L))+'</span>';
  if(R && R!=='—' && R!=='依原動作') h += '<span class="rx rx-r"><b>R</b> '+escHtml(rxText(R))+'</span>';

}
function sideTagsHtml(L, R){ return rxHtml(L, R); }
function metaRow(k, v){ return '<div class="mrow"><span class="mk">'+escHtml(k)+'</span><span class="mv">'+escHtml(v)+'</span></div>'; }
/* lock text comes from the domain layer with a leading emoji; the UI shows it without */
function lockText(t){ return String(t||'').replace(/^[\u{1F512}\u{23F8}\u{26D4}]\uFE0F?\s*/u, ''); }

/* what the card actually shows: the original exercise, or — when routing put
   this slot into substitute mode — the fallback, with the original's slot id

/* ================= chart builders (hand-rolled SVG, no dependency) ================= */
function lineChartSvg(seriesList, opts){
  opts = opts || {};
  var W = opts.width||320, H = opts.height||140, P = {l:24,r:10,t:12,b:20};
  var n = 0;
  seriesList.forEach(function(s){ if(s.points.length>n) n = s.points.length; });
  if(n===0) return '';
  var allY = [];
  seriesList.forEach(function(s){ s.points.forEach(function(p){ if(p.y!==null && p.y!==undefined) allY.push(p.y); }); });
  if(!allY.length) return '';
  var yMin = opts.yMin!==undefined ? opts.yMin : Math.min.apply(null,allY);
  var yMax = opts.yMax!==undefined ? opts.yMax : Math.max.apply(null,allY);
  if(opts.yMin===undefined) yMin = Math.min(yMin,0);
  if(yMax===yMin) yMax = yMin+1;
  function xPos(i){ return P.l + (n<=1?((W-P.l-P.r)/2):(i/(n-1))*(W-P.l-P.r)); }
  function yPos(v){ return P.t + (1-(v-yMin)/(yMax-yMin))*(H-P.t-P.b); }
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;overflow:visible">';
  for(var g=0; g<=2; g++){
    var gy = P.t + g*(H-P.t-P.b)/2;
    svg += '<line x1="'+P.l+'" y1="'+gy.toFixed(1)+'" x2="'+(W-P.r)+'" y2="'+gy.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';
  }
  if(opts.thresholdY!==undefined && opts.thresholdY!==null){
    var ty = yPos(opts.thresholdY);
    svg += '<line x1="'+P.l+'" y1="'+ty.toFixed(1)+'" x2="'+(W-P.r)+'" y2="'+ty.toFixed(1)+'" stroke="var(--danger)" stroke-width="1" stroke-dasharray="3,3" opacity=".6"/>';
  }
  seriesList.forEach(function(s){
    var segPts = [];
    s.points.forEach(function(p,i){
      if(p.y===null||p.y===undefined) return;
      segPts.push(xPos(i).toFixed(1)+','+yPos(p.y).toFixed(1));
    });
    if(segPts.length>1){
      svg += '<polyline points="'+segPts.join(' ')+'" fill="none" stroke="'+s.color+'" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>';
    }
    s.points.forEach(function(p,i){
      if(p.y===null||p.y===undefined) return;
      svg += '<circle cx="'+xPos(i).toFixed(1)+'" cy="'+yPos(p.y).toFixed(1)+'" r="2.4" fill="'+s.color+'"/>';
    });
  });
  if(opts.xLabels){
    opts.xLabels.forEach(function(lab,i){
      if(!lab) return;
      var anchor = (i===0) ? 'start' : (i===opts.xLabels.length-1 ? 'end' : 'middle');
      svg += '<text x="'+xPos(i).toFixed(1)+'" y="'+(H-4)+'" font-size="9.5" fill="var(--ink-faint)" text-anchor="'+anchor+'" font-family="Space Grotesk, sans-serif">'+escHtml(lab)+'</text>';
    });
  }
  svg += '</svg>';
  return svg;
}
function barRowHtml(label, value, max, color, valText){
  var pct = max>0 ? clamp(value/max*100,0,100) : 0;
  return '<div class="bar-chart-row"><span class="bcr-label">'+escHtml(label)+'</span><span class="bcr-track"><span class="bcr-fill" style="width:'+pct+'%;background:'+color+'"></span></span><span class="bcr-val">'+escHtml(valText!==undefined?valText:value)+'</span></div>';
}

/* v4: tiny trend line for list rows (no axes, last point marked) */
function sparklineSvg(vals, opts){
  opts = opts || {};
  var W = opts.w || 64, H = opts.h || 22, pad = 2.5;
  if(!vals || vals.length < 2){
    return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" aria-hidden="true"><line x1="2" y1="'+(H-pad)+'" x2="'+(W-2)+'" y2="'+(H-pad)+'" stroke="var(--line-2)" stroke-dasharray="2 3"/></svg>';
  }
  var yMin = opts.yMin!==undefined ? opts.yMin : Math.min.apply(null, vals);
  var yMax = opts.yMax!==undefined ? opts.yMax : Math.max.apply(null, vals);
  if(yMax===yMin) yMax = yMin + 1;
  var n = vals.length;
  var pts = vals.map(function(v, i){ return [pad + (i/(n-1))*(W-pad*2), pad + (1-(v-yMin)/(yMax-yMin))*(H-pad*2)]; });
  var d = pts.map(function(p, i){ return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); }).join('');
  var last = pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" aria-hidden="true">'+
    '<path d="'+d+'" fill="none" stroke="var(--ink-faint)" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2" fill="var(--ink)"/></svg>';
}

      ex = EX_BY_ID[key] || null;

/* ================= CALENDAR tab — protocol timeline =================
   v4: weeks are blocks (W · phase · 7-dot state strip · done count). Past
   weeks fold into one row so the current week sits near the top; the current
   and next week open by default. Row states: done ✓ / today / future ○ /
   rest — / test ◇ / missed (dashed). Same gotoDay / toggleDayDone hooks. */
function groupByWeek(){
  var byWeek = {};
  SCHEDULE_KEYS.forEach(function(k){
    var w = SCHEDULE[k].weekNum;
    if(!byWeek[w]) byWeek[w] = [];
    byWeek[w].push(k);
  });
  return byWeek;
}
function calDayState(k, tKey, w, type){
  if(w.dayDone) return 'done';
  if(k === tKey) return 'today';
  if(k > tKey) return (type==='休息') ? 'rest' : (type==='測試日' ? 'test' : 'future');
  if(type==='休息') return 'rest';
  if(type==='測試日') return 'test';
  return 'missed';
}
function calWeekHtml(wn, keys, tKey, open, isCurrent){
  var sc0 = SCHEDULE[keys[0]];
  var dots = '', rows = '', done = 0, due = 0;
  keys.forEach(function(k){
    var d = keyToDate(k);
    var sc = SCHEDULE[k];
    var w = getDayLog(k);
    var actualType = w.dayType || sc.dayType;
    var swapped = actualType !== sc.dayType;
    var st = calDayState(k, tKey, w, actualType);
    if(k <= tKey){ due++; if(w.dayDone) done++; }
    var dotCls = st==='today' ? 'today' : (st==='done' ? (actualType==='測試日' ? 'test done' : 'done') : st);
    dots += '<i class="wd '+dotCls+'"></i>';
    var info = DAY_TYPE_INFO[actualType];
    var sub = swapped ? '原計畫 '+escHtml(DAY_TYPE_INFO[sc.dayType]?DAY_TYPE_INFO[sc.dayType].short:sc.dayType) : (w.note ? escHtml(w.note) : '');
    var rowSt = (st==='done' && k > tKey) ? 'future' : st;
    var dsCls = w.dayDone ? 'done' : (st==='today' ? 'future' : st);
    if(actualType==='測試日') dsCls += (dsCls.indexOf('test')===-1 ? ' test' : '');
    rows += '<div class="cal-row st-'+rowSt+(k===tKey?' istoday':'')+(swapped?' swapped':'')+'" data-action="gotoDay" data-key="'+k+'">'+
      '<span class="cr-dow">'+DOW_EN[d.getDay()]+'</span>'+
      '<span class="cr-date">'+(d.getMonth()+1)+'/'+pad2(d.getDate())+'</span>'+
      '<span class="cr-main"><span class="cr-type">'+escHtml(info?info.short:actualType)+'<em>'+escHtml(DAY_CODE[actualType]||'')+'</em></span>'+(sub?'<span class="cr-sub">'+sub+'</span>':'')+'</span>'+
      '<span class="dstatus '+dsCls+'" data-action="toggleDayDone" data-key="'+k+'" role="button" aria-label="標記'+k+'完成"><span class="ds-g">'+(w.dayDone?ICON_CHECK:'')+'</span></span>'+
    '</div>';
  });
  var phaseShort = String(sc0.phase).replace(/^Phase (\d)\s*/, 'P$1 · ');
  return '<details class="wk'+(isCurrent?' current':'')+'"'+(open?' open':'')+'>'+
    '<summary><span class="wk-num num">W'+pad2(wn)+'</span>'+
    '<span class="wk-phase"><b>'+escHtml(phaseShort)+'</b>'+(sc0.deload?' · DELOAD':'')+'</span>'+
    '<span class="wk-dots">'+dots+'</span>'+
    '<span class="wk-count num">'+(due?done+'/'+due:'—')+'</span></summary>'+
    '<div class="wk-days">'+rows+'</div></details>';
}
function renderCalendar(){
  var parts = [];
  var tKey = todayKey();

  var completed = 0, pastCount = 0;
  SCHEDULE_KEYS.forEach(function(k){
    if(k <= tKey){
      pastCount++;
      var w = getDayLog(k);
      if(w.dayDone) completed++;
    }
  });
  var curSched = SCHEDULE[tKey];
  parts.push('<div class="cal-status">'+
    '<div class="cs-cell"><div class="cs-v">'+completed+'<small>/'+pastCount+'</small></div><div class="cs-l">DAYS DONE</div></div>'+
    '<div class="cs-cell"><div class="cs-v">'+(curSched?('W'+pad2(curSched.weekNum)):'—')+'</div><div class="cs-l">CURRENT WEEK</div></div>'+
    '<div class="cs-cell"><div class="cs-v">'+(curSched?curSched.phase.replace(/Phase (\d).*/,'P$1'):'—')+'</div><div class="cs-l">PHASE</div></div>'+
  '</div>');
  parts.push('<div class="cal-legend"><span><i class="wd done"></i>完成</span><span><i class="wd today"></i>今天</span><span><i class="wd"></i>未到</span><span><i class="wd missed"></i>未完成</span><span><i class="wd rest"></i>休息</span><span><i class="wd test"></i>測試</span></div>');

  var byWeek = groupByWeek();
  var weekNums = Object.keys(byWeek).map(Number).sort(function(a,b){return a-b;});
  var focusWeek = curSched ? curSched.weekNum : (tKey < PLAN_START_KEY ? weekNums[0] : weekNums[weekNums.length-1]);
  var past = weekNums.filter(function(wn){ return wn < focusWeek; });
  var ahead = weekNums.filter(function(wn){ return wn >= focusWeek; });

  if(past.length){
    var pd = 0, pt = 0;
    past.forEach(function(wn){ byWeek[wn].forEach(function(k){ pt++; if(getDayLog(k).dayDone) pd++; }); });
    parts.push('<details class="cal-past"><summary><span class="cp-k">PAST</span><span class="cp-v num">W'+pad2(past[0])+' – W'+pad2(past[past.length-1])+'</span><span class="cp-sum num">'+pd+'/'+pt+'</span><span class="chev"></span></summary>');
    past.forEach(function(wn){ parts.push(calWeekHtml(wn, byWeek[wn], tKey, false, false)); });
    parts.push('</details>');
  }
  ahead.forEach(function(wn, i){ parts.push(calWeekHtml(wn, byWeek[wn], tKey, i < 2, wn===focusWeek && !!curSched)); });
  return parts.join('');
}


/* ================= STATS tab ================= */
function computeStreaks(){
  var keys = SCHEDULE_KEYS.filter(function(k){ return k<=todayKey(); });
  var longest=0, run=0;
  keys.forEach(function(k){
    var w=getDayLog(k);
    if(w.dayDone){ run++; if(run>longest) longest=run; } else { run=0; }
  });
  var cs=0;
  for(var i=keys.length-1;i>=0;i--){
    var w=getDayLog(keys[i]);
    if(w.dayDone) cs++; else break;
  }
  return {current:cs, longest:longest};
}
function computeAdherence(){
  var keys = SCHEDULE_KEYS.filter(function(k){ return k<=todayKey(); });
  var done = keys.filter(function(k){ return getDayLog(k).dayDone; }).length;
  return {done:done, total:keys.length, pct: keys.length? Math.round(done/keys.length*100):0};
}
function computeByDayType(){
  var agg = {};
  DAY_TYPES.concat(['測試日']).forEach(function(t){ agg[t]={done:0,total:0}; });
  SCHEDULE_KEYS.filter(function(k){ return k<=todayKey(); }).forEach(function(k){
    var sc=SCHEDULE[k]; var w=getDayLog(k);
    var t = w.dayType || sc.dayType;
    if(!agg[t]) agg[t]={done:0,total:0};
    agg[t].total++;
    if(w.dayDone) agg[t].done++;
  });
  return agg;
}
function computeWeeklyAdherence(){
  var byWeek = groupByWeek();
  var weekNums = Object.keys(byWeek).map(Number).sort(function(a,b){return a-b;});
  var tKey = todayKey();
  var out = [];
  weekNums.forEach(function(wn){
    var keys = byWeek[wn].filter(function(k){ return k<=tKey; });
    if(!keys.length) return;
    var done = keys.filter(function(k){ return getDayLog(k).dayDone; }).length;
    out.push({week:wn, done:done, total:keys.length});
  });
  return out;
}
function computeBballLoad(){
  var games=0, minutes=0;
  SCHEDULE_KEYS.filter(function(k){ return k<=todayKey(); }).forEach(function(k){
    var w = getDayLog(k);
    var m = numOrNull(w.gameMinutes);
    if(m!==null && m>0){ games++; minutes+=m; }
  });
  return {games:games, minutes:minutes};
}
function computeAnkleFlagDays(){
  var out = [];
  SCHEDULE_KEYS.forEach(function(k){
    var w = state.dayLogs[k];
    if(!w || !w.flags) return;
    if(w.flags.swell||w.flags.limp||w.flags.giveway||w.flags.over10d) out.push(k);
  });
  return out;
}
function symptomSeries(code){
  var meta = SYMPTOM_META[code];
  if(!meta || !meta.logField) return [];
  var pts=[];
  SCHEDULE_KEYS.forEach(function(k){
    var w = getDayLog(k);
    var v = numOrNull(w[meta.logField]);
    if(v!==null) pts.push({k:k, v:v});
  });
  return pts;
}
function symptomLatest(code){
  if(code==='B'){
    // 9/28: daily numbness and exercise-level 麻／電／刺痛 in the last 14 days take priority over the last EAST test
    var cutoff = dateKey(addDays(todayDate(), -14)), tk = todayKey();
    var recentNumb = SCHEDULE_KEYS.filter(function(d){ return d>=cutoff && d<=tk && state.dayLogs[d] && (state.dayLogs[d].numb || dayHasNeuro(d)); });
    if(recentNumb.length){
      return {display:'有麻', dateLabel:fmtMD(keyToDate(recentNumb[recentNumb.length-1]))+'（日誌）', trend:null, status:symKmStatus('B')};
    }
    var keys = TEST_DATE_KEYS.filter(function(k){ return peekTestLog(k)['EAST 有無麻']; });
    if(!keys.length) return {display:'—', dateLabel:'尚無紀錄', trend:null, status:symKmStatus('B')};
    var lk = keys[keys.length-1];
    var numb = peekTestLog(lk)['EAST 有無麻'];
    var neg = (numb==='無'||numb==='否');
    return {display: neg?'無麻':'有麻', dateLabel:fmtMD(keyToDate(lk)), trend:null, status:symKmStatus('B')};
  }
  var pts = symptomSeries(code);
  if(!pts.length) return {display:'—', dateLabel:'尚無紀錄', trend:null, status:symKmStatus(code)};
  var last = pts[pts.length-1];
  var prev = pts.length>1 ? pts[pts.length-2] : null;
  return {display:String(last.v), dateLabel:fmtMD(keyToDate(last.k)), trend: prev!==null?(last.v-prev.v):null, status:symKmStatus(code)};
}
function symptomCardHtml(code){
  var meta = SYMPTOM_META[code];

function buildSymptomChartSeries(codes){
  var dateSet = {};
  codes.forEach(function(c){ symptomSeries(c).forEach(function(p){ dateSet[p.k]=true; }); });
  var dates = Object.keys(dateSet).sort();
  var series = codes.map(function(c){
    var meta = SYMPTOM_META[c];
    var byDate = {};

    return { label: meta.name, color: meta.color, points: dates.map(function(dk){ return {y: byDate[dk]!==undefined?byDate[dk]:null}; }) };
  });
  return {series:series, dates:dates};
}
function sparseXLabels(dates){
  var xLabels = dates.map(function(){ return ''; });
  if(xLabels.length){ xLabels[0]=fmtMD(keyToDate(dates[0])); if(xLabels.length>1) xLabels[xLabels.length-1]=fmtMD(keyToDate(dates[dates.length-1])); }
  return xLabels;
}
function buildRowChart(){
  var dates = TEST_DATE_KEYS;
  var leftPts = dates.map(function(dk){ return {y:numOrNull(peekTestLog(dk)['左手划船8RM kg'])}; });
  var rightPts = dates.map(function(dk){ return {y:numOrNull(peekTestLog(dk)['右手划船8RM kg'])}; });
  return {series:[{label:'左手 8RM',color:HEX.left,points:leftPts},{label:'右手 8RM',color:HEX.right,points:rightPts}], dates:dates};
}
function buildDiffChart(){
  var dates = TEST_DATE_KEYS;
  var pts = dates.map(function(dk){
    var t = peekTestLog(dk);
    var l = numOrNull(t['左手划船8RM kg']), r = numOrNull(t['右手划船8RM kg']);
    var v = (l!==null && r!==null && r!==0) ? Math.round(Math.abs(r-l)/r*100) : null;
    return {y:v};
  });
  return {series:[{label:'左右差 %',color:HEX.danger,points:pts}], dates:dates};
}

/* ---- 9/28: left/right comparison from per-exercise side logs ----
   latest session per movement that has BOTH sides logged; weaker side highlighted. */
function lrCompareHtml(){
  var seen = {}, rows = [];
  for(var i=SCHEDULE_KEYS.length-1; i>=0; i--){
    var d = SCHEDULE_KEYS[i];
    if(d > todayKey()) continue;
    var w = state.dayLogs[d];
    if(!w || !w.sx) continue;
    Object.keys(w.sx).forEach(function(id){
      if(seen[id]) return;
      var r = w.sx[id];
      if(!r || r.sub || !r.L || !r.R) return;
      var lk = numOrNull(r.L.kg), rk = numOrNull(r.R.kg), ln = numOrNull(r.L.n), rn = numOrNull(r.R.n);
      var useKg = lk!==null && rk!==null && lk>0 && rk>0;
      var lv = useKg ? lk : ln, rv = useKg ? rk : rn;
      if(lv===null || rv===null || !(lv>0) || !(rv>0)) return;
      seen[id] = true;
      rows.push({d:d, id:id, lv:lv, rv:rv, unit: useKg ? 'kg' : ((EX_BY_ID[id]||{}).unit||'下')});
    });
  }
  var html = '<div class="subhead">左右對比<span>各動作最近一次</span></div><div class="chart-card">';
  if(!rows.length){
    html += '<div class="chart-empty">在動作卡展開後分左右記錄重量或次數，這裡會列出每個動作的左右比例</div></div>';
    return html;
  }
  rows.slice(0, 12).forEach(function(r){
    var mx = Math.max(r.lv, r.rv), pct = Math.round(Math.min(r.lv, r.rv)/mx*100);
    var weak = r.lv < r.rv ? 'L' : (r.rv < r.lv ? 'R' : '');
    var name = EX_BY_ID[r.id] ? EX_BY_ID[r.id]['動作名稱'] : r.id;
    html += '<div class="lr-row"><div class="lr-name">'+escHtml(name)+'<small>'+fmtMD(keyToDate(r.d))+'</small></div>'+
      '<div class="lr-bars"><div class="lr-b l'+(weak==='L'?' weak':'')+'"><i style="width:'+(r.lv/mx*100).toFixed(0)+'%"></i><span>左 '+fmtKg(r.lv)+r.unit+'</span></div>'+
      '<div class="lr-b r'+(weak==='R'?' weak':'')+'"><i style="width:'+(r.rv/mx*100).toFixed(0)+'%"></i><span>右 '+fmtKg(r.rv)+r.unit+'</span></div></div>'+
      '<div class="lr-pct'+(pct < CONFIG.WEAK_SIDE_RATIO*100 ? ' low' : '')+'">'+pct+'%</div></div>';
  });
  html += '<div class="tiny muted" style="margin-top:8px">比例＝弱側 ÷ 強側。低於 '+Math.round(CONFIG.WEAK_SIDE_RATIO*100)+'% 時，進度建議會讓強側先維持、弱側先加。</div></div>';
  return html;
}

/* ================= LIBRARY tab =================
   9/27 fix: the old app filtered by a hard-coded LIB_FILTERS array, so when
   the day-type names got renamed (上肢A/上肢B → 推日/拉日) on 8/29, the old
   filter list no longer matched any exercise's 課表日 and those categories
   silently vanished from "全部". Filters are now derived from whatever
   categories actually exist in LIBRARY_EXERCISES, ordered by LIB_FILTER_ORDER
   with any unrecognised category appended at the end — so this can't happen
   again even if the data changes further. */
if(!state.libOpen) state.libOpen = {};
function computeLibFilters(){
  var present = {};
  LIBRARY_EXERCISES.forEach(function(e){ present[e['課表日']] = true; });
  var ordered = LIB_FILTER_ORDER.filter(function(dt){ return present[dt]; });
  Object.keys(present).forEach(function(dt){ if(ordered.indexOf(dt)===-1) ordered.push(dt); });
  return ['全部'].concat(ordered);
}

function libDayLabel(dt){
  if(dt==='替代動作') return '替代動作（出現麻／電／刺痛時自動換上）';
  if(dt==='上肢A') return '上肢A（舊）';
  if(dt==='上肢B') return '上肢B（舊）';
  return DAY_TYPE_INFO[dt] ? DAY_TYPE_INFO[dt].label : dt;
}
function libDayShort(dt){
  if(dt==='上肢A') return '上肢A(舊)';
  if(dt==='上肢B') return '上肢B(舊)';
  return DAY_TYPE_INFO[dt] ? DAY_TYPE_INFO[dt].short : dt;
}

function libraryExerciseCardHtml(ex){
  var lk = ex['課表日']+'#'+ex['順序'];
  var isOpen = !!state.libOpen[lk];
  var cat = ex['類別'];
  var kind = cat==='主項' ? 'main' : (cat==='副項' ? 'assist' : (cat==='重設' ? 'reset' : 'test'));
  var html = '<div class="ex-card lib k-'+kind+(isOpen?' open':'')+'">';
  html += '<div class="ex-top" data-action="toggleLibOpen" data-libkey="'+lk+'">';
  html += '<span class="ex-num num">'+pad2(ex['順序'])+'</span>';
  html += '<div class="ex-body"><div class="ex-kicker"><span class="ex-cat">'+escHtml(CAT_CODE[cat]||cat||'')+'</span><span class="lib-day">'+escHtml(libDayShort(ex['課表日']))+'</span></div>';
  html += '<div class="ex-name">'+escHtml(ex['動作名稱'])+'</div>';

  if(ex['模組']) meta += metaRow('模組', ex['模組']+(ex['階段']?' · 階段 '+ex['階段']:''));
  if(ex.rebuild){
    meta += metaRow('肩胛重建期', ex.rebuild.skip ? '暫停' : ('左 '+rxText(ex.rebuild.L||ex['左邊'])+'／右 '+rxText(ex.rebuild.R||ex['右邊'])+(ex.rebuild.optional?'（選做）':'')));
  }
  if(ex.fallback && EX_BY_ID[ex.fallback]){
    meta += metaRow('出現麻／電／刺痛時替代', ex.fallback==='fb-light' ? '同動作降階版（50% 重量・半程）' : EX_BY_ID[ex.fallback]['動作名稱']);
  }
  if(ex['進階條件']) meta += metaRow('進階', ex['進階條件']);
  if(ex['解鎖日']) meta += metaRow('解鎖日', ex['解鎖日']);
  if(meta) html += '<div class="ex-meta">'+meta+'</div>';
  if(ex['退階／紅旗'] && ex['退階／紅旗']!=='—') html += '<div class="ex-flagline"><span class="fl-tag">STOP</span>'+escHtml(ex['退階／紅旗'])+'</div>';
  if(ex['左腳踝有事時'] && ex['左腳踝有事時'].indexOf('照做')!==0){
    html += '<div class="ex-anklenote"><span class="fl-tag">ANKLE</span>左腳踝有事版：'+escHtml(ex['左腳踝有事時'])+'</div>';
  }
  var codes = symCodesOf(ex['對應狀況']);
  if(codes.length){
    html += '<div class="exd-label why">WHY · 為什麼練</div><div class="ex-symlink">';
    codes.forEach(function(c){
      var meta2 = SYMPTOM_META[c];
      html += '<span class="tag sym" data-action="gotoKnowledgeSym" data-code="'+escHtml(c)+'">'+escHtml(meta2?meta2.name:c)+' →</span>';
    });
    html += '</div>';
  }
  html += '</div></div>';

function renderLibrary(){
  var parts = [];
  var filters = computeLibFilters();
  parts.push('<input class="searchbox" type="text" placeholder="搜尋動作名稱、模組、對應狀況…" value="'+escHtml(state.libSearch)+'" data-action="libSearch">');
  parts.push('<div class="chipbar">');
  filters.forEach(function(f){
    var label = f==='全部' ? '全部' : libDayShort(f);
    parts.push('<button type="button" class="chip'+(state.libFilter===f?' sel':'')+'" data-action="setLibFilter" data-value="'+escHtml(f)+'">'+escHtml(label)+'</button>');
  });
  parts.push('</div>');

  var list = LIBRARY_EXERCISES.slice();
  if(state.libFilter !== '全部' && filters.indexOf(state.libFilter)!==-1){
    list = list.filter(function(e){ return e['課表日']===state.libFilter; });
  } else if(state.libFilter !== '全部'){
    state.libFilter = '全部'; // filter no longer exists (data changed) — fall back safely
  }
  var q = state.libSearch.trim().toLowerCase();
  if(q){
    list = list.filter(function(e){
      return (e['動作名稱']+e['模組']+e['對應狀況']+e['執行要點']).toLowerCase().indexOf(q) !== -1;
    });
  }

  if(!list.length){
    parts.push('<div class="empty-note">沒有符合的動作</div>');
    return parts.join('');
  }

  if(state.libFilter==='全部' && !q){
    filters.slice(1).forEach(function(dt){
      var items = list.filter(function(e){ return e['課表日']===dt; });
      if(!items.length) return;
      parts.push('<div class="subhead lib-head"><span class="lh-name">'+escHtml(libDayLabel(dt))+(DAY_CODE[dt]?'<em>'+DAY_CODE[dt]+'</em>':'')+'</span><span>'+items.length+' 項</span></div>');
      items.forEach(function(e){ parts.push(libraryExerciseCardHtml(e)); });
    });
  } else {
    list.forEach(function(e){ parts.push(libraryExerciseCardHtml(e)); });
  }
  return parts.join('');
}

function testIsFilled(t){
  return !!(t['左手划船8RM kg'] && t['右手划船8RM kg']);
}
function testHasData(t){
  return Object.keys(t).some(function(f){
    if(f==='測試日期' || f==='週次' || f==='階段' || f==='_updatedAt') return false;
    return t[f]!==undefined && t[f]!==null && t[f]!=='';
  });
}
function computeDiffPct(t){
  var l = parseFloat(t['左手划船8RM kg']), r = parseFloat(t['右手划船8RM kg']);
  if(!l || !r) return null;
  return Math.round(Math.abs(r-l)/r*100);
}
function computeStageStatus(k){
  var idx = TEST_DATE_KEYS.indexOf(k);
  if(idx===-1) return {label:'額外測試（非排定的 4 週週期）', cls:''};
  if(idx===0) return {label:'基準測試', cls:''};
  var t = peekTestLog(k);
  if(idx===1){
    if(!t['靠牆滑行 左肋外翻']) return {label:'待填寫', cls:''};
    return t['靠牆滑行 左肋外翻']==='否' ? {label:'✓ 達標，可進 Phase 2', cls:'ok'} : {label:'尚未達標，續留 Phase 1', cls:'bad'};

  if(!testIsFilled(t)) return {label:'待填寫', cls:''};
  return phase3Ready() ? {label:'✓ 連續兩次達標，可進／維持 Phase 3+', cls:'ok'} : {label:'尚未連續達標', cls:'bad'};
}

function allTestKeys(){
  var extra = Object.keys(state.testLogs).filter(function(k){
    if(TEST_DATE_KEYS.indexOf(k)!==-1) return false;
    var t = state.testLogs[k];
    return t && testHasData(t);
  });
  return TEST_DATE_KEYS.concat(extra).sort();
}

function renderTests(){
  var parts = [];
  var keys = allTestKeys();

  var filledTests = keys.map(function(k){return peekTestLog(k);}).filter(testIsFilled);
  if(filledTests.length >= 2){
    parts.push(secHtml('01','TREND','趨勢'));
    parts.push('<div class="tr-table">');
    var rows = [
      ['左划船8RM','左手划船8RM kg','kg'], ['右划船8RM','右手划船8RM kg','kg'],
      ['左右差%','__diff__','%'], ['左後肩酸秒數','EAST 左後肩酸出現秒數','s'],
      ['挺直呼氣秒數','挺直呼氣60秒 F出現秒數','s'], ['動態翼狀','動態翼狀 出現角度','']
    ];
    rows.forEach(function(r){
      var vals = keys.map(function(k){
        var t = peekTestLog(k);
        var v = r[1]==='__diff__' ? computeDiffPct(t) : t[r[1]];
        return (v===undefined||v==='') ? null : v;
      });
      if(vals.every(function(v){return v===null;})) return;
      parts.push('<div class="trend-row"><span class="tlabel">'+r[0]+'</span><span class="tvals">'+
        vals.map(function(v,i){
          if(v===null) return '';
          var sc = SCHEDULE[keys[i]];
          var wl = sc ? ('W'+sc.weekNum) : fmtMD(keyToDate(keys[i]));
          return '<span class="tv"><em>'+wl+'</em>'+v+r[2]+'</span>';
        }).join('')+
      '</span></div>');
    });
    parts.push('</div>');
  }

  parts.push(secHtml(filledTests.length >= 2 ? '02' : '01','RECORDS','測試記錄'));
  if(keys.indexOf(todayKey())===-1){
    parts.push('<button type="button" class="btn ghost block test-add" data-action="openTest" data-key="'+todayKey()+'">+ 新增今天的額外測試</button>');
  }
  keys.forEach(function(k){
    var t = peekTestLog(k);
    var filled = testIsFilled(t) || testHasData(t);
    var isOpen = (state.testOpen === k);
    var d = keyToDate(k);
    var sc = SCHEDULE[k];
    parts.push('<div class="test-item'+(isOpen?' open':'')+'">');
    parts.push('<div class="ti-head" data-action="'+(isOpen?'closeTest':'openTest')+'" data-key="'+k+'">');
    parts.push('<div><div class="ti-date">'+fmtYMD(d)+(sc?'<span class="ti-w">W'+pad2(sc.weekNum)+'</span>':'')+'</div><div class="ti-phase">'+escHtml(sc?sc.phase:'額外測試')+'</div></div>');
    if(testIsFilled(t)){
      var diff = computeDiffPct(t);
      parts.push('<span class="ti-status ok">左'+t['左手划船8RM kg']+'／右'+t['右手划船8RM kg']+'kg'+(diff!==null?'（差'+diff+'%）':'')+'</span>');
    } else if(filled){
      parts.push('<span class="ti-status part">已填部分資料</span>');
    } else {
      parts.push('<span class="ti-status">'+(k===todayKey()?'今天':(k<todayKey()?'待補':'尚未到'))+' · 填寫</span>');
    }
    parts.push('</div>');
    if(isOpen){ parts.push(testFormHtml(k)); }
    parts.push('</div>');
  });

  return parts.join('');
}

    if(selPill && pillSig !== _lastPillSig){

/* async callbacks (sync finished, pull merged) must never rebuild the DOM
   under someone's thumb while they type — defer until no field is focused */
function isEditingField(){
  var a = document.activeElement;
  return !!(a && (a.tagName==='INPUT' || a.tagName==='TEXTAREA') && document.getElementById('view').contains(a));
}
function renderIfIdle(){ if(!isEditingField()) render(); }
/* after a field's change event, only re-render once focus has actually left
   the form — re-rendering synchronously replaced the input the person had
   just tapped, so moving from one field to the next needed two taps */
function renderAfterFieldChange(){ setTimeout(function(){ if(!isEditingField()) render(); }, 0); }

function setNested(obj, path, value){
  var parts = path.split('.');
  var o = obj;
  for(var i=0;i<parts.length-1;i++){
    if(o[parts[i]]===undefined || o[parts[i]]===null) o[parts[i]] = {};
    o = o[parts[i]];
  }
  o[parts[parts.length-1]] = value;
}
function getNested(obj, path){
  var parts = path.split('.');
  var o = obj;
  for(var i=0;i<parts.length;i++){ if(o===undefined || o===null) return undefined; o = o[parts[i]]; }
  return o;
}
function scopeObj(scope, key){
  return scope==='test' ? getTestLog(key) : getDayLog(key);
}
function sxRec(k, id){
  var w = getDayLog(k);
  if(!w.sx[id]) w.sx[id] = {};
  return w.sx[id];
}

  if(action==='closeTest'){ state.testOpen = null; render(); return; }

  if(action==='toggleLibOpen'){ var lk=t.dataset.libkey; state.libOpen[lk] = !state.libOpen[lk]; render(); return; }
  if(action==='toggleExDone'){
    var w = getDayLog(t.dataset.key);
    var ek = t.dataset.exkey;
    w.exDone[ek] = !w.exDone[ek];
    state.fx = {done: t.dataset.key+'#'+ek};
    scheduleSave('day', t.dataset.key); render(); return;
  }
  if(action==='toggleDayDone'){
    var w2 = getDayLog(t.dataset.key);
    w2.dayDone = !w2.dayDone;
    scheduleSave('day', t.dataset.key); render(); return;
  }
  if(action==='completeAll'){
    // ticks only what the view-model says is doable: never locked, skipped or optional items
    var k4 = t.dataset.key;
    var w4 = getDayLog(k4);
    exListFor(w4.dayType, k4).map(function(e){ return exViewModel(e, k4, w4); }).forEach(function(vm){
      if(!vm.lock && !vm.optional) w4.exDone[vm.key] = true;
    });
    w4.dayDone = true;
    state.celebrate = k4;
    scheduleSave('day', k4); render();
    setTimeout(function(){ if(state.celebrate===k4){ state.celebrate=null; render(); } }, 900);

  }
  if(action==='setSxState'){

    if(rec7.st==='neuro'){
      var w7 = getDayLog(k7);
      w7.numb = true;                 // keeps the day-level numbness record consistent
      w7.exDone[id7] = true;          // the attempt counts as a session for routing
    }
    scheduleSave('day', k7); render(); return;
  }
  if(action==='setDayType'){
    var k5=t.dataset.key, v5=t.dataset.value;
    getDayLog(k5).dayType = v5;
    scheduleSave('day', k5); render(); return;
  }
  if(action==='resetDayType'){

    var w6=getDayLog(k6);
    var sc6=SCHEDULE[k6];
    w6.dayType = sc6 ? sc6.dayType : w6.dayType;
    scheduleSave('day', k6); render(); return;
  }
  if(action==='toggleBool'){
    var obj = scopeObj(t.dataset.scope, t.dataset.key);
    setNested(obj, t.dataset.field, !getNested(obj, t.dataset.field));
    scheduleSave(t.dataset.scope==='test'?'test':'day', t.dataset.key); render(); return;
  }

    var val = t.dataset.value;
    setNested(obj2, t.dataset.field, (String(cur)===String(val)) ? '' : val);
    scheduleSave(t.dataset.scope==='test'?'test':'day', t.dataset.key); render(); return;
  }

  if(action==='doExport'){ state.backupText = buildBackupJSON(); state.backupMsg='已產生備份文字，記得複製走或下載。'; render(); return; }
  if(action==='doDownload'){ var okd=downloadBackupFile(); state.backupMsg = okd? '已觸發下載。' : '這個環境不支援直接下載，改用「匯出備份」+「複製到剪貼簿」。'; render(); return; }

    try{ await STORE.set('supa-config', JSON.stringify({url:'', key:''})); }catch(e){}
    render(); return;
  }

<script type="module">
/* =====================================================================
   PARTICLE HUMAN — identity layer (independent component)
   · Not part of the app's render code. It watches #view for re-renders and
     moves ONE persistent <canvas> into the Today hero's .ph-slot, so a
     re-render never restarts or flickers it.
   · Posterior view (back to the viewer): the person's LEFT scapula sits on
     the viewer's left and is tinted with the LEFT colour; the ring on its
     inferior angle marks the F symptom site.
   · Assembles once when Today is entered (~1.1 s, one scan pass), breathes
     very slightly, then holds still after ~9 s. No infinite loop.
   · prefers-reduced-motion → one static frame. Pauses (freezes) when the
     tab is hidden or the hero scrolls away. pointer-events:none (CSS).
   ===================================================================== */
(function(){
  var view = document.getElementById('view');
  if(!view) return;
  var canvas = document.createElement('canvas');
  var ctx = canvas.getContext ? canvas.getContext('2d') : null;
  if(!ctx) return;
  canvas.className = 'ph-canvas';
  canvas.setAttribute('aria-hidden', 'true');
  var reduceMQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  function reduced(){ return !!(reduceMQ && reduceMQ.matches); }

  /* ---- body model: 100 × 210 units, x = 50 is the midline ---- */
  var HALF = [[54,27],[54.6,33],[62,36],[70.5,38.8],[74.5,44],[75.6,52],[76.4,66],[77.4,80],[78.2,94],[78.6,103],[79.8,108],
    [78.4,116],[75,113.5],[73.8,104],[71.8,92],[69.8,80],[68.4,66],[66.8,57],[65.6,70],[64,84],[65.4,96],[66.8,108],[65.8,124],
    [63.8,142],[62.8,151],[62.2,168],[60.6,190],[62.4,200.5],[55.4,201.5],[55,192],[54,170],[53.4,151],[52.6,128],[50.6,112]];
  var POLY = HALF.concat(HALF.slice().reverse().map(function(p){ return [100-p[0], p[1]]; }));
  var HEAD = {cx:50, cy:16.5, rx:8.4, ry:10.2};
  var ASSEMBLE = 1150, SPAN = 560, FADE_START = 6500, END = 9000;

  function inPoly(x, y){
    var inside = false;
    for(var i=0, j=POLY.length-1; i<POLY.length; j=i++){
      var xi=POLY[i][0], yi=POLY[i][1], xj=POLY[j][0], yj=POLY[j][1];
      if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside = !inside;
    }
    return inside;
  }
  function inHead(x, y){ var dx=(x-HEAD.cx)/HEAD.rx, dy=(y-HEAD.cy)/HEAD.ry; return dx*dx+dy*dy <= 1; }
  function rng(seed){ // deterministic, so the figure is the same every visit
    return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  /* kinds: 0 interior · 1 outline · 2 spine · 3 left scapula (cyan) · 4 right scapula */
  function mk(x, y, kind, R){
    var a = [.09 + R()*.14, .24 + R()*.24, .28 + R()*.14, .5 + R()*.2, .26 + R()*.12][kind];
    return {x:x, y:y, k:kind, a:a, s: kind===1 ? 1.1 + R()*.5 : .9 + R()*.55,

  }
  function build(scale){
    var R = rng(20260928), pts = [];
    var nIn = Math.round(330*scale), nEdge = Math.round(300*scale), guard = 0;
    while(pts.length < nIn && guard++ < 30000){
      var x = 20 + R()*60, y = 6 + R()*197;
      if(inPoly(x, y) || inHead(x, y)) pts.push(mk(x, y, 0, R));
    }
    var segs = [], total = 0;
    for(var i=0; i<POLY.length; i++){
      if(i === POLY.length-1) continue;             // neck-top closing edge sits under the head
      var a = POLY[i], b = POLY[i+1], L = Math.hypot(b[0]-a[0], b[1]-a[1]);
      segs.push([a, b, L]); total += L;
    }
    var headL = Math.PI*(3*(HEAD.rx+HEAD.ry) - Math.sqrt((3*HEAD.rx+HEAD.ry)*(HEAD.rx+3*HEAD.ry)));
    for(var n=0; n<nEdge; n++){
      var t = R()*(total+headL), jit = (R()-.5)*1.1;
      if(t < total){
        for(var s=0; s<segs.length; s++){
          if(t <= segs[s][2]){
            var f = t/segs[s][2], A = segs[s][0], B = segs[s][1];
            var nx = -(B[1]-A[1])/segs[s][2], ny = (B[0]-A[0])/segs[s][2];
            pts.push(mk(A[0]+(B[0]-A[0])*f + nx*jit, A[1]+(B[1]-A[1])*f + ny*jit, 1, R));

          }
          t -= segs[s][2];
        }
      } else {
        var th = R()*Math.PI*2;
        pts.push(mk(HEAD.cx + Math.cos(th)*(HEAD.rx+jit*.8), HEAD.cy + Math.sin(th)*(HEAD.ry+jit*.8), 1, R));
      }
    }
    for(var y2=29; y2<=108; y2+=2.3) pts.push(mk(50 + (R()-.5)*.5, y2, 2, R));
    // scapula: medial border, lateral border, spine of scapula (right side; mirrored for left)
    [[[56.2,41],[57.8,63]], [[57.8,63],[67,46.5]], [[56.6,45.5],[70,40.5]]].forEach(function(seg){
      var A = seg[0], B = seg[1], L = Math.hypot(B[0]-A[0], B[1]-A[1]), steps = Math.round(L/2.1);
      for(var q=0; q<=steps; q++){
        var f = q/steps, x = A[0]+(B[0]-A[0])*f, y = A[1]+(B[1]-A[1])*f;
        pts.push(mk(x + (R()-.5)*.5, y + (R()-.5)*.5, 4, R));
        pts.push(mk(100 - x + (R()-.5)*.5, y + (R()-.5)*.5, 3, R));
      }
    });
    pts.sort(function(a, b){ return a.k - b.k; }); // fewer fillStyle switches per frame
    return pts;
  }

  /* ---- canvas ---- */
  var PTS = null, W = 0, H = 0, DPR = 1, S = 1, OX = 0, OY = 0;
  var raf = 0, running = false, t0 = 0, last = 0, hadSlot = false;
  function resize(){
    var slot = canvas.parentNode;
    if(!slot) return false;
    var r = slot.getBoundingClientRect();
    var w = Math.round(r.width), h = Math.round(r.height), dpr = Math.min(window.devicePixelRatio || 1, 2);
    if(!w || !h || (w===W && h===H && dpr===DPR)) return false;

    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    S = Math.min(w/66, h/200);
    OX = w/2 - 50*S; OY = (h - 197*S)/2 - 6*S;
    return true;
  }
  function ease(x){ return 1 - Math.pow(1 - x, 3); }
  function ring(ux, uy, rgba){
    ctx.beginPath(); ctx.arc(OX + ux*S, OY + uy*S, 2.6*S, 0, Math.PI*2);
    ctx.strokeStyle = rgba; ctx.lineWidth = 1; ctx.stroke();
  }
  function draw(t){
    if(!W || !PTS) return;
    var settled = (t === Infinity);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    var env = 0, breath = 0;
    if(!settled && t > ASSEMBLE){
      var bt = t - ASSEMBLE;
      env = bt < 800 ? bt/800 : (t > FADE_START ? Math.max(0, 1 - (t - FADE_START)/(END - FADE_START)) : 1);
      breath = Math.sin(bt/4200*Math.PI*2);
    }
    var kind = -1;
    for(var i=0; i<PTS.length; i++){
      var p = PTS[i];
      var e = settled ? 1 : ease(Math.min(1, Math.max(0, (t - p.dl)/SPAN)));
      if(e <= 0) continue;
      if(p.k !== kind){ kind = p.k; ctx.fillStyle = kind===3 ? 'rgb(106,174,191)' : 'rgb(232,230,224)'; }
      var torso = (p.y > 30 && p.y < 112) ? 1 : .35;
      var x = OX + p.x*S + p.sx*(1-e);
      var y = OY + p.y*S + p.sy*(1-e) - breath*env*.45*torso*S;
      ctx.globalAlpha = p.a*e;
      ctx.fillRect(x - p.s/2, y - p.s/2, p.s, p.s);
    }
    ctx.globalAlpha = 1;
    var lm = settled ? 1 : Math.min(1, Math.max(0, (t - 700)/400));
    if(lm > 0){
      ring(50, 30.2, 'rgba(232,230,224,'+(.2*lm).toFixed(3)+')');
      ring(57.8, 63, 'rgba(232,230,224,'+(.2*lm).toFixed(3)+')');
      ring(42.2, 63, 'rgba(106,174,191,'+(.6*lm).toFixed(3)+')');
    }
    if(!settled && t < ASSEMBLE + 150){           // one scan pass while assembling
      var k = t/(ASSEMBLE + 150), sy = OY + (6 + k*196)*S, ga = .34*(1 - k*k*k);
      var g = ctx.createLinearGradient(OX + 12*S, 0, OX + 88*S, 0);
      g.addColorStop(0, 'rgba(124,201,164,0)'); g.addColorStop(.5, 'rgba(124,201,164,'+ga.toFixed(3)+')'); g.addColorStop(1, 'rgba(124,201,164,0)');
      ctx.fillStyle = g; ctx.fillRect(OX + 12*S, sy, 76*S, 1);
    }
  }
  function drawStatic(){ draw(Infinity); }
  function stop(){ if(raf) cancelAnimationFrame(raf); raf = 0; running = false; }
  function tick(now){
    if(!running) return;
    var t = now - t0;
    if(t >= END){ running = false; raf = 0; drawStatic(); return; }
    if(t > ASSEMBLE && now - last < 33){ raf = requestAnimationFrame(tick); return; } // ~30 fps once assembled
    last = now; draw(t);
    raf = requestAnimationFrame(tick);
  }
  function play(){
    stop();
    if(reduced() || !W || document.hidden){ drawStatic(); return; }
    t0 = performance.now(); last = 0; running = true;
    raf = requestAnimationFrame(tick);
  }
  function freeze(){ if(running){ stop(); drawStatic(); } }

  /* ---- mounting: follow the app's renders without touching its code ---- */
  function mount(){
    var slot = view.querySelector('.ph-slot');
    if(!slot){ if(hadSlot) stop(); hadSlot = false; return; }
    if(canvas.parentNode !== slot) slot.appendChild(canvas);
    if(!PTS){
      var small = Math.min(screen.width || 400, screen.height || 800) < 360 || (navigator.deviceMemory && navigator.deviceMemory < 3);
      PTS = build(small ? .7 : 1);
    }
    var resized = resize();
    if(!hadSlot){ hadSlot = true; play(); }        // entered Today → assemble once
    else if(resized && !running) drawStatic();      // re-render on Today → keep the finished figure
  }
  new MutationObserver(mount).observe(view, {childList:true});
  document.addEventListener('visibilitychange', function(){ if(document.hidden) freeze(); });
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(entries){
      entries.forEach(function(en){ if(!en.isIntersecting) freeze(); });
    }).observe(canvas);
  }
  window.addEventListener('resize', function(){ if(canvas.parentNode && resize() && !running) drawStatic(); });
  if(reduceMQ && reduceMQ.addEventListener) reduceMQ.addEventListener('change', function(){ if(reduced()) freeze(); });
  window.ATR_PH = {replay: play, freeze: freeze, get running(){ return running; }}; // debug handle
  mount();
})();

</script>
